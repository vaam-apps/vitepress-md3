name: pr-title

# The pull request title must be a conventional commit.
#
# Not a style rule: this repository squash-merges with the PR title as the
# commit subject, and that subject is the only thing `release-please.yml`
# reads to decide whether there is a release to propose and whether it is a
# patch, a minor or a major. A non-conventional title is invisible to it.
#
# A separate workflow rather than a job in `ci.yml`, because fixing a title
# raises `edited`, and re-running the whole build on every title typo is
# waste. Implemented as one regex rather than a marketplace action, for the
# same reason as vaam-apps/vsms and vaam-apps/ui: an unpinned moving
# dependency inside the release pipeline is a real future-breakage risk.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  # `commit-message-parses` lists the pull request's commits via the REST API.
  pull-requests: read

jobs:
  conventional-title:
    name: title is a conventional commit
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          # Via the environment, never interpolated into the script body:
          # a PR title is attacker-controlled text and `${{ }}` inside a
          # `run:` is textual substitution, so a title containing a quote
          # and a semicolon would execute.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # type(optional scope)optional-!: subject
          #
          # The type list is exactly the one `release-please-config.json`
          # declares changelog sections for — including `deps`, which
          # `vaam-apps/vsms`'s own copy of this pattern omits despite its
          # own config declaring a "Dependencies" section for it. That is
          # a real inconsistency there, not a convention worth repeating
          # here: this file's list matches its own config exactly. `feat`
          # and `fix` move the version; `!` (or a `BREAKING CHANGE:`
          # footer in the body) makes it a major. Everything else still
          # produces a release, as a patch.
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deps)(\([a-zA-Z0-9,._/ -]+\))?!?: .+'

          if printf '%s' "$TITLE" | grep -qE "$PATTERN"; then
            echo "OK — $TITLE"
            exit 0
          fi

          {
            echo "### Pull request title is not a conventional commit"
            echo
            echo '```'
            echo "$TITLE"
            echo '```'
            echo
            echo "It must start with one of \`feat\` \`fix\` \`docs\` \`style\`"
            echo "\`refactor\` \`perf\` \`test\` \`build\` \`ci\` \`chore\` \`revert\`"
            echo "\`deps\`, an optional \`(scope)\`, an optional \`!\` for a"
            echo "breaking change, then \`: \` and a subject. For example:"
            echo
            echo '```'
            echo "fix: the outline marker overlaps the first heading"
            echo "feat(shapes): add the clover-8 shape"
            echo "feat(config)!: style defaults to standard"
            echo '```'
            echo
            echo "This repository squash-merges with the PR title as the"
            echo "commit subject on \`main\`, and it is the only thing"
            echo "release-please reads to decide the next version. Edit the"
            echo "title and this check re-runs on its own."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error title=Non-conventional PR title::${TITLE}"
          exit 1

  # The title is only line 1 of what lands. This job checks the WHOLE squash
  # message with release-please's own parser, because a body line can make
  # release-please discard the entire commit — silently, with the workflow
  # green. See ci/commit-message-parse/parse.mjs for the incident (found on
  # vaam-apps/vsms) and the exact grammar rule.
  #
  # It lives in `pr-title.yml` rather than its own file because it shares
  # this trigger exactly: `edited` (the title changed) and `synchronize`
  # (the commits changed) are both inputs to the assembled message, and the
  # heavier gates above still must not listen for `edited`.
  commit-message-parses:
    name: the squash message parses as a conventional commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      # A standalone npm project with a committed lockfile and an exact pin,
      # deliberately outside `pnpm-workspace.yaml` — a CI tool, not
      # application code. The pin is `@conventional-commits/parser` 0.4.1,
      # the only version satisfying release-please 17.6.0's own `^0.4.1`
      # (release-please-action@v5.0.0 resolves to that release-please
      # version — checked directly against its own `package.json`, not
      # assumed), so this guard parses with exactly the grammar
      # release-please will use. A looser range here would let the two
      # disagree, which is the one way this check could report a verdict
      # that does not match reality.
      - name: Install the parser
        working-directory: ci/commit-message-parse
        run: npm ci

      - name: Parse the message this pull request would land
        working-directory: ci/commit-message-parse
        env:
          # Via the environment, never `${{ }}` inside `run:` — a pull
          # request title is attacker-controlled text and `${{ }}` in a
          # `run:` body is textual substitution.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node parse.mjs
