name: Release

# Publishes @vaam-apps/vitepress-md3 to npm when release-please pushes a
# v* tag. Authenticates with npm Trusted Publishing (OIDC), so there is no
# npm token to leak or rotate: the package's Trusted Publisher on npmjs.com
# must name this repository and this file, `release.yml`. Renaming the file
# breaks publishing.

on:
  push:
    tags: ["v*.*.*"]
  # Re-run a failed publish by hand: dispatch it with the tag as the ref.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Must run on a version tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::release must run on a v* tag, got $GITHUB_REF. Dispatch it with the tag as the ref, or let release-please.yml create the tag."
              exit 1
              ;;
          esac

      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag disagrees with package.json $manifest"
            exit 1
          fi

      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      - name: Validate the tarball
        run: pnpm publish --dry-run --no-git-checks

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: pnpm publish --access public --provenance --no-git-checks
